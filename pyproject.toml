[project]
name = "reservoir"
version = "0.2.0"
description = "JAX-based Reservoir Computing with GPU acceleration"
authors = [
    { name = "yoshi", email = "yossyf1147@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14.4"
dependencies = [
    "numpy",
    "tqdm",
    "jax[cuda13]",
    "optax",
    "flax",
    "beartype",
    "jaxtyping",
    "tensorcircuit-ng[jax]",
]

[project.optional-dependencies]
viz = [
    "matplotlib",
]
mnist = [
    "torch",
    "torchvision",
]
quantum-extra = [
    "qiskit",
]
hpo = [
    "optuna",
]
notebook = [
    "ipykernel",
]
analysis = [
    "pandas",
]

[dependency-groups]
dev = [
    "matplotlib",
    "torch",
    "torchvision",
    "pandas",
    "pandas-stubs",
    "qiskit",
    "optuna",
    "optuna-dashboard",
    "ipykernel",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservoir"]

[tool.hatch.build.targets.sdist]
include = ["src"]

[[tool.uv.index]]
name = "jax_cuda_releases"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
tensorcircuit-ng = { git = "https://github.com/tensorcircuit/tensorcircuit-ng.git" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pyrefly]
project-includes = ["src"]

# Type check unannotated function bodies and infer return types using Pyrefly's current config keys.
check-unannotated-defs = true
infer-return-types = "checked"

[tool.pyrefly.errors]
# Pyrefly error kinds verified against `pyrefly check --help` and official configuration docs.
missing-import = true
untyped-import = true
implicit-any = true
unannotated-parameter = true
redundant-cast = true


# Ruff全体の設定
[tool.ruff]
target-version = "py314"

# Linter個別の設定
[tool.ruff.lint]
extend-select = [
    "UP", "TCH", "S101",

    # Detect common Python bug patterns such as mutable defaults and loop-variable issues.
    "B",

    # Require explicit exception handling and discourage broad exception catches.
    "BLE", "TRY",

    # Detect unused arguments. Interface-level exceptions are documented in the suppression registry.
    "ARG",

    # Detect unnecessary code patterns.
    "PIE"
]
extend-ignore = [
    "TRY003", # 標準例外（ValueError等）への長文メッセージ/f-stringの直接指定を許可
    "ARG001", # MLインターフェース慣習: ファクトリ/ローダーのシグネチャ統一のため未使用関数引数を許可
    "ARG002", # MLインターフェース慣習: 親クラスのシグネチャを保持するため未使用メソッド引数を許可 (scikit-learn convention)
    "ARG004", # MLインターフェース慣習: staticmethodでも親のtrain()シグネチャを保持するため許可
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["beartype.beartype", "beartype"]
